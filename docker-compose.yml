name: vetystock

x-php-service: &php-service
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: vetystock-php
  restart: unless-stopped
  # Si un servicio está apagado, la búsqueda de su nombre falla en ~1 s en vez de 8 s.
  dns_opt:
    - timeout:1
    - attempts:1
  depends_on:
    db:
      condition: service_healthy
  environment: &php-env
    DB_HOST: db
    DB_PORT: "3306"
    DB_DATABASE: laudi
    DB_USERNAME: root
    DB_PASSWORD: ${DB_PASSWORD:-root}
    SERVICE_SECRET: ${SERVICE_SECRET:-change-me-in-production}
    AUTH_SERVICE_URL: http://auth
    CATALOG_SERVICE_URL: http://catalog
    INVENTORY_SERVICE_URL: http://inventory
    ANIMALS_SERVICE_URL: http://animals
    ASSISTANT_SERVICE_URL: http://assistant

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: laudi
      TZ: America/Bogota
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  main:
    <<: *php-service
    environment:
      <<: *php-env
      APP_DOCROOT: /var/www/html/public
    ports:
      - "8000:80"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
      catalog:
        condition: service_started
      inventory:
        condition: service_started
      animals:
        condition: service_started
      assistant:
        condition: service_started

  auth:
    <<: *php-service
    environment:
      <<: *php-env
      APP_DOCROOT: /var/www/html/services/auth/public
    ports:
      - "8101:80"

  catalog:
    <<: *php-service
    environment:
      <<: *php-env
      APP_DOCROOT: /var/www/html/services/catalog/public
    ports:
      - "8102:80"

  inventory:
    <<: *php-service
    environment:
      <<: *php-env
      APP_DOCROOT: /var/www/html/services/inventory/public
    ports:
      - "8103:80"

  animals:
    <<: *php-service
    environment:
      <<: *php-env
      APP_DOCROOT: /var/www/html/services/animals/public
    ports:
      - "8104:80"

  assistant:
    <<: *php-service
    environment:
      <<: *php-env
      APP_DOCROOT: /var/www/html/services/assistant/public
      # LM Studio corre en el equipo anfitrión, fuera de Docker.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:1234/v1}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-20b}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-180}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8105:80"

volumes:
  db-data:
