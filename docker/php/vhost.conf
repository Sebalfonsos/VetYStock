<VirtualHost *:80>
    DocumentRoot ${APP_DOCROOT}

    # url() genera enlaces /public/index.php, así que /public apunta a la misma carpeta.
    Alias /public ${APP_DOCROOT}

    <Directory ${APP_DOCROOT}>
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # mod_php no pasa la cabecera Authorization a $_SERVER sin esto.
    SetEnvIf Authorization "(.+)" HTTP_AUTHORIZATION=$1

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
